# Tests only — runs on every PR and on main, across supported Python versions.
# Publishing lives EXCLUSIVELY in release.yml (tag-triggered, trusted
# publishing registered to that filename); keep this workflow free of any
# publish/deploy steps so PR runs never need credentials or environments.
#
# Actions are pinned to commit SHAs (supply-chain hygiene); Dependabot keeps
# the pins fresh via .github/dependabot.yml.
name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check  # strict mode comes from [tool.mypy] in pyproject
        run: mypy src

      - name: Test  # includes the examples compile gate
        run: pytest -q

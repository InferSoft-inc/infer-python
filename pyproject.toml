[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infersoft"
dynamic = ["version"]
description = "Python SDK for the Infersoft document-processing REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "InferSoft" }]
keywords = ["infersoft", "document", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.31",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://infersoft.com"
Repository = "https://github.com/InferSoft-inc/infer-python"
Issues = "https://github.com/InferSoft-inc/infer-python/issues"
Changelog = "https://github.com/InferSoft-inc/infer-python/blob/main/CHANGELOG.md"
Documentation = "https://github.com/InferSoft-inc/infer-python/blob/main/api.md"

[tool.hatch.version]
path = "src/infersoft/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/infersoft"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
